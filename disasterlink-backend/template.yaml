AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DisasterLink full-stack cloud serverless production backend stack layout.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  # 1. CENTRAL API GATEWAY PROXY
  DisasterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # 2. DYNAMODB SINGLE-TABLE DESIGN LAYOUT
  DisasterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DisasterLink
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. AMAZON COGNITO USER POOL DIRECTORY CONTROL
  DisasterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: DisasterLink-Users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
        - Name: skills
          AttributeDataType: String
          Mutable: true

  DisasterUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: DisasterLink-WebClient
      UserPoolId: !Ref DisasterUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # 4. AMAZON S3 SECURE IMAGE BUCKET
  DisasterImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "disasterlink-images-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - POST
              - PUT
            AllowedOrigins:
              - "*"

  # 5. AMAZON SNS EMERGENCY ALERTS TOPIC
  DisasterAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: DisasterLink-EmergencyAlerts
      DisplayName: "DisasterLink Alerts"

  ResidentAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DisasterAlertsTopic
      Protocol: email
      Endpoint: "testresident@test.com"

  # 6. AMAZON LOCATION SERVICE PLACE INDEX
  DisasterPlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: DisasterLink-PlaceIndex
      DataSource: Here
      DataSourceConfiguration:
        IntendedUse: SingleUse

    # 7. AUTHENTICATION MICROSERVICE
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/auth/index.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref DisasterUserPool
          CLIENT_ID: !Ref DisasterUserPoolClient
          TABLE_NAME: !Ref DisasterTable
      Events:
        AuthRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /auth/{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DisasterTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminConfirmSignUp
              Resource: !GetAtt DisasterUserPool.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Platform: "node"
        Format: "esm"
        MainFields: "module,main"
        OutExtension:
          - ".js=.mjs"
        Sourcemap: true
        EntryPoints: 
          - handlers/auth/index.js

  # 8. INCIDENTS MICROSERVICE
  IncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/incidents/index.handler
      Environment:
        Variables:
          IMAGE_BUCKET_NAME: !Ref DisasterImageBucket
          SNS_TOPIC_ARN: !Ref DisasterAlertsTopic
          PLACE_INDEX_NAME: !Ref DisasterPlaceIndex
          TABLE_NAME: !Ref DisasterTable
      Events:
        RootIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /incidents
            Method: ANY
        ProxyIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /incidents/{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DisasterTable
        - S3CrudPolicy:
            BucketName: !Ref DisasterImageBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt DisasterAlertsTopic.TopicName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - geo:SearchPlaceIndexForText
              Resource: !GetAtt DisasterPlaceIndex.IndexArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Platform: "node"
        Format: "esm"
        MainFields: "module,main"
        OutExtension:
          - ".js=.mjs"
        Sourcemap: true
        EntryPoints: 
          - handlers/incidents/index.js

  # 9. VOLUNTEERS MICROSERVICE MODULE
  VolunteersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/volunteers/index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DisasterTable
      Events:
        RootVolunteers:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /volunteers
            Method: ANY
        ProxyVolunteers:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /volunteers/{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DisasterTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Platform: "node"
        Format: "esm"
        MainFields: "module,main"
        OutExtension:
          - ".js=.mjs"
        Sourcemap: true
        EntryPoints: 
          - handlers/volunteers/index.js

Outputs:
  ApiEndpoint:
    Description: Live production API Gateway root deployment URL endpoint string layout proxy.
    Value: !Sub "https://${DisasterApi}.execute-api.${AWS::Region}://"
  UserPoolId:
    Description: Cognito secure identity management user pool identifier lookup path.
    Value: !Ref DisasterUserPool
  UserPoolClientId:
    Description: Application browser portal verification database client access hash token.
    Value: !Ref DisasterUserPoolClient
